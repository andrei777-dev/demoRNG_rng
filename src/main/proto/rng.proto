syntax = "proto3";

// Contract for the RNG Service.
// The protobuf-maven-plugin compiles this file into Java classes at build time.
package rng.v1;

option java_multiple_files = true;
option java_package = "com.demorng.rng.grpc";
option java_outer_classname = "RngProto";

// RNG Service — stateless secure random number generator.
// Only caller in the MVP: Scratch Card Engine.
service RngService {
  // Generate `count` secure random integers, each in the inclusive range [min, max].
  rpc GenerateIntegers(GenerateIntegersRequest) returns (GenerateIntegersResponse);
}

message GenerateIntegersRequest {
  int32 min = 1;    // inclusive lower bound
  int32 max = 2;    // inclusive upper bound
  int32 count = 3;  // how many integers to generate (must be > 0)
}

message GenerateIntegersResponse {
  repeated int32 values = 1;
}
